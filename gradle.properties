# Gradle Daemon Memory & Garbage Collector (Increased Heap to 6GB for Compose/KSP)
org.gradle.jvmargs=-Xmx6144m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle Build Speed Flags
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true

# Kotlin Daemon & Incremental Compilation
kotlin.daemon.jvmargs=-Xmx3072m
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.code.style=official

# KSP Incremental Processing (Room Annotation Processor)
ksp.incremental=true
ksp.incremental.intermodule=true

# Android Project Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# JDK Home (Android Studio JBR)
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
